server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers — deliberately at server level, not inside `location /`:
    # nginx's add_header does NOT merge across nesting levels — a location block
    # that defines its own add_header (like /_next/static/ and /fonts/ below, for
    # Cache-Control) discards ALL headers inherited from a parent location, not
    # just the ones it redefines. Keeping these at server level means every
    # location — including the two below — actually inherits them.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; worker-src blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Serve static files; fall back to trailing-slash index.html (Next.js trailingSlash: true)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Cache immutable Next.js hashed chunks aggressively
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fonts
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
